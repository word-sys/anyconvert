[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anyconvert"
version = "0.1.0"
description = "Universal lossless document and file conversion library"
readme = "README.md"
authors = [
    { name = "Barın Güzeldemirci (word-sys)" },
]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = [
    "pdf",
    "conversion",
    "docx",
    "odt",
    "pptx",
    "odp",
    "xlsx",
    "lossless",
    "document-converter",
    "export"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Text Processing :: General",
    "Topic :: Office/Business",
]
dependencies = [
    "PyMuPDF>=1.23.0",
    "Pillow>=9.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
docx = ["python-docx>=1.0.0"]
pptx = ["python-pptx>=0.6.20"]
odf = ["odfpy>=1.4.0"]
xlsx = ["openpyxl>=3.0.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine"
]
all = [
    "python-docx>=1.0.0",
    "python-pptx>=0.6.20",
    "odfpy>=1.4.0",
    "openpyxl>=3.0.0"
]

[project.scripts]
anyconvert = "anyconvert.cli.main:main"

[project.urls]
Homepage = "https://github.com/word-sys/anyconvert"
Repository = "https://github.com/word-sys/anyconvert"
Issues = "https://github.com/word-sys/anyconvert/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anyconvert = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
