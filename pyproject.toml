[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "anyconvert"
version = "0.1.0"
description = "Enterprise-grade, zero-dependency PDF document conversion engine."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "anyconvert contributors"}
]
keywords = [
    "pdf",
    "converter",
    "docx",
    "pptx",
    "odt",
    "odp",
    "pure-python",
    "zero-dependency",
    "document-processing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: Markup",
    "Topic :: Printing",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
anyconvert = "anyconvert.cli:main"

[project.urls]
Homepage = "https://github.com/word-sys/anyconvert"
Documentation = "https://github.com/word-sys/anyconvert#readme"
Repository = "https://github.com/word-sys/anyconvert"
Issues = "https://github.com/word-sys/anyconvert/issues"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_subclassing_any = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
