name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify quality gates and build package
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip and install build/verification tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest mypy ruff build twine
          pip install --no-deps -e .

      - name: Run Ruff lint check
        run: ruff check src/ tests/

      - name: Run Mypy strict type check
        run: mypy --strict src/ tests/

      - name: Run pytest test suite
        run: pytest -v --tb=short

      - name: Build source distribution and binary wheel
        run: python -m build

      - name: Verify package metadata with Twine
        run: twine check --strict dist/*

      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          retention-days: 1

  publish-to-pypi:
    name: Publish package to PyPI
    needs: verify-and-build
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/anyconvert
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
